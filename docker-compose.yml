services:
  backend:
    build: ./backend
    container_name: SuperKart-backend

    ports:
      - "7860:7860"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:7860/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build: ./frontend
    container_name: SuperKart-frontend

    environment:
      BACKEND_URL: "http://SuperKart-backend:7860"

    ports:
      - "8501:8501"

    depends_on:
      backend:
        condition: service_healthy
